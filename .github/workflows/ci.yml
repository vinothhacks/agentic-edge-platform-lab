name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pydantic sqlmodel jinja2 httpx \
            python-dotenv pytest pytest-asyncio ruff anyio

      - name: Lint (ruff)
        run: ruff check apps/ tests/

      - name: Test (pytest)
        run: pytest tests/unit/ -q
