[project]
name = "agentic-edge-platform-lab"
version = "0.1.0"
description = "Self-service internal platform for edge/load-balancing infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AEPL Contributors"}]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "sqlmodel>=0.0.21",
  "jinja2>=3.1.4",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "redis>=5.0.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[project.scripts]
platformctl = "platformctl.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
